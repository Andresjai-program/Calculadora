<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PQRS - TelecomCalc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#0F766E',      // Teal oscuro
                        'secondary': '#FDBA74',    // Naranja suave
                        'bg-dark-soft': '#1E293B',
                        'text-light': '#F8FAFC',
                        'text-dark': '#1E293B',
                        'header-footer': '#334155',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        '3xl': '0 35px 60px -15px rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            transition: background-color 0.3s, color 0.3s; 
            background-color: #F8FAFC; 
            color: #1E293B; 
        }
        .dark body { 
            background-color: #1E293B; 
            color: #F8FAFC; 
        }
    </style>
</head>
<body class="light-mode">

    <header class="sticky top-0 z-40 bg-header-footer shadow-lg dark:bg-gray-900 transition duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center w-full">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center text-3xl font-bold text-primary dark:text-secondary hover:text-secondary dark:hover:text-primary transition duration-200">
                    <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 14c-3.313 0-6-2.687-6-6s2.687-6 6-6 6 2.687 6 6-2.687 6-6 6zm-1-8h2v-2h-2v2zm0 4h2v-2h-2v2z"/></svg>
                    TelecomCalc
                </a>
            </div>

            <div class="hidden lg:block flex-grow max-w-lg mx-auto">
                <div class="relative">
                    <input type="text" placeholder="Buscar fórmulas, términos o ayuda..." 
                           class="w-full p-2 pl-10 rounded-full bg-gray-600 dark:bg-gray-700 text-white placeholder-gray-400 border border-transparent focus:border-primary focus:ring-1 focus:ring-primary transition duration-200">
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <div class="flex items-center space-x-3 ml-auto">
                <button id="themeToggle" class="flex items-center p-2 rounded-full text-sm font-medium bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 shadow-inner hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-300">
                    </button>
                <a href="pqrs.html" class="hidden sm:inline-block px-3 py-2 text-sm font-semibold rounded-full text-white bg-primary dark:bg-teal-700 transition duration-200 shadow-md">
                    PQRS
                </a>
                <a id="calculateButtonHeader" href="calculadora.html" class="inline-flex items-center bg-secondary dark:bg-orange-600 text-white dark:text-bg-dark-soft font-bold py-2 px-4 rounded-full shadow-lg hover:shadow-xl transition duration-200 ease-in-out transform hover:scale-105">
                    <span class="flex items-center">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m-3 3v6m0 0h-2m2 0h2m-6-4h6"/></svg>
                        Calcular
                    </span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        
        <section class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl border-t-4 border-primary dark:border-secondary">
            <h1 class="text-3xl font-extrabold text-primary dark:text-secondary mb-2 flex items-center">
                <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.545A9.954 9.954 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                PQRS y Sugerencias
            </h1>
            <p class="mb-6 text-gray-600 dark:text-gray-400">Tu retroalimentación es vital para mejorar **TelecomCalc**. Todas las contribuciones se publican de forma anónima.</p>

            <form id="pqrsForm" class="space-y-5">
                
                <div>
                    <label for="pqrsType" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Tipo de Contribución <span class="text-red-500">*</span></label>
                    <select id="pqrsType" required class="mt-1 block w-full p-2.5 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600 focus:ring-secondary focus:border-secondary shadow-sm">
                        <option value="">-- Seleccione una opción --</option>
                        <option value="Pregunta">Pregunta</option>
                        <option value="Queja">Queja / Reporte de Error</option>
                        <option value="Reclamo">Reclamo</option>
                        <option value="Sugerencia">Sugerencia de Mejora</option>
                        <option value="Comentario">Comentario Positivo / General</option>
                    </select>
                </div>

                <div>
                    <label for="rating" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Puntúa TelecomCalc (1 a 5 estrellas) <span class="text-red-500">*</span></label>
                    <div id="rating" class="flex items-center space-x-1">
                        </div>
                    <input type="hidden" id="ratingValue" required data-current-rating="0">
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Mensaje (Mínimo 20 caracteres) <span class="text-red-500">*</span></label>
                    <textarea id="message" required minlength="20" class="mt-1 block w-full p-3 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600 focus:ring-secondary focus:border-secondary shadow-sm" rows="6" placeholder="Escribe tu mensaje, tu sugerencia, o el error que encontraste."></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="name" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Nombre (Opcional - Se usará un alias)</label>
                        <input id="name" class="mt-1 block w-full p-2.5 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600 focus:ring-primary focus:border-primary shadow-sm" placeholder="Tu nombre o un alias">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Correo (Opcional - No se publica)</label>
                        <input type="email" id="email" class="mt-1 block w-full p-2.5 border rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600 focus:ring-primary focus:border-primary shadow-sm" placeholder="tu@correo.com">
                    </div>
                </div>

                <div>
                    <button type="submit" id="submitBtn" class="w-full px-6 py-3 bg-primary dark:bg-secondary text-white dark:text-bg-dark-soft rounded-xl font-bold text-lg hover:bg-teal-700 dark:hover:bg-orange-500 transition duration-200 shadow-md transform hover:scale-[1.01]">
                        Enviar Contribución
                    </button>
                </div>
                
                <div id="formMessage" class="hidden text-center p-3 rounded-lg text-sm font-medium"></div>

            </form>
        </section>
        
        <section class="mt-10">
            <h2 class="text-2xl font-extrabold text-header-footer dark:text-gray-200 mb-5 border-b border-gray-300 dark:border-gray-600 pb-2">
                Retroalimentación de Usuarios
            </h2>
            
            <div id="commentsSummary" class="bg-gray-100 dark:bg-gray-700 p-4 rounded-lg shadow mb-6 flex justify-between items-center">
                </div>
            
            <div id="commentsList" class="space-y-5">
                <p class="text-center text-gray-500 dark:text-gray-400">Cargando comentarios...</p>
            </div>
        </section>
        
    </main>

    <footer class="mt-10 py-6 bg-header-footer dark:bg-gray-900 transition duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center text-gray-300 text-sm">
            <button class="flex items-center space-x-2 px-4 py-2 rounded-lg bg-primary dark:bg-secondary text-white dark:text-bg-dark-soft font-semibold hover:opacity-90 transition duration-200 mb-4 sm:mb-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Descargar Manual (PDF)</span>
            </button>
            <div class="text-center sm:text-left space-y-1">
                <p>&copy; Copyright 2025. Todos los derechos reservados.</p>
                <p>Contacto: <span class="text-secondary dark:text-primary font-mono">+57 310 4535196</span></p>
            </div>
        </div>
    </footer>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // ===================================================
            // --- Lógica del Tema (Theme) ---
            // ===================================================

            function toggleTheme() {
                const html = document.documentElement;
                const isDarkMode = html.classList.toggle('dark');
                localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
                updateThemeButton();
            }
            function updateThemeButton() {
                const themeToggleBtn = document.getElementById('themeToggle');
                if (!themeToggleBtn) return;
                const isDarkMode = document.documentElement.classList.contains('dark');
                themeToggleBtn.innerHTML = isDarkMode 
                    ? '<svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3a9 9 0 009 9c0 4.54-3.52 8.44-8.45 8.97a.75.75 0 01-.8-.85c.17-1.13.25-2.3.25-3.47a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75c0 1.17-.08 2.34-.25 3.47a.75.75 0 01-.8.85C6.52 20.44 3 16.54 3 12a9 9 0 019-9z"/></svg> Modo Claro' 
                    : '<svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.885 18.885c.38.38.38 1.02.042 1.358-.337.337-1.02.34-1.358.042l-1.597-1.597a1.06 1.06 0 011.554-1.423l1.414 1.414zM21 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM12 18.75a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM5.132 18.885l-1.597-1.597a1.06 1.06 0 011.554-1.423l1.414 1.414c.38.38.38 1.02.042 1.358-.337.337-1.02.34-1.358.042zM3 12a.75.75 0 01.75.75h2.25a.75.75 0 010-1.5H3a.75.75 0 01-.75.75zM12 6.75a.75.75 0 01-.75-.75V3.75a.75.75 0 011.5 0v2.25a.75.75 0 01-.75.75z"/></svg> Modo Oscuro';
            }

            // Inicialización del Tema
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeButton();
            const tBtn = document.getElementById('themeToggle');
            if (tBtn) tBtn.addEventListener('click', toggleTheme);

            // ===================================================
            // --- Lógica de PQRS ---
            // ===================================================
            
            const COMMENTS_STORAGE_KEY = 'telecomcalc_pqrs_comments';
            const commentsListContainer = document.getElementById('commentsList');
            const form = document.getElementById('pqrsForm');
            const ratingContainer = document.getElementById('rating');
            const ratingValueInput = document.getElementById('ratingValue');
            const formMessage = document.getElementById('formMessage');
            const commentsSummaryContainer = document.getElementById('commentsSummary');

            // --- 1. Funciones de Almacenamiento (Simulado) ---

            function getComments() {
                const stored = localStorage.getItem(COMMENTS_STORAGE_KEY);
                // Si no hay comentarios, inicializar con algunos ejemplos para demostrar la funcionalidad
                if (!stored) {
                    return [
                        { id: Date.now() + 1, type: "Comentario", message: "Excelente herramienta, me ha ahorrado mucho tiempo en los cálculos de enlace.", rating: 5, date: new Date().toLocaleDateString('es-CO') },
                        { id: Date.now() + 2, type: "Sugerencia", message: "Podrían añadir la fórmula de pérdidas por trayectoria en espacio libre (FSPL).", rating: 4, date: new Date().toLocaleDateString('es-CO') },
                        { id: Date.now() + 3, type: "Queja", message: "El campo para la temperatura en la fórmula de Ruido Térmico debería aceptar Celsius, aunque luego lo conviertan a Kelvin.", rating: 3, date: new Date().toLocaleDateString('es-CO') }
                    ];
                }
                return JSON.parse(stored);
            }

            function saveComment(comment) {
                const comments = getComments();
                comments.push(comment);
                localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(comments));
            }
            
            // --- 2. Funciones de UI ---

            function generateStarSVG(filled) {
                const color = filled ? 'text-secondary dark:text-primary' : 'text-gray-300 dark:text-gray-600';
                return `<svg class="w-6 h-6 ${color} cursor-pointer transition-colors duration-150" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.001 8.73c-.783-.57-.381-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
            }

            function initRating() {
                ratingContainer.innerHTML = '';
                for (let i = 1; i <= 5; i++) {
                    const star = document.createElement('div');
                    star.innerHTML = generateStarSVG(false);
                    star.dataset.value = i;
                    star.className = 'star';
                    
                    star.addEventListener('click', () => {
                        const value = parseInt(star.dataset.value);
                        ratingValueInput.value = value;
                        ratingValueInput.setAttribute('data-current-rating', value);
                        updateStars(value);
                    });
                    
                    star.addEventListener('mouseover', () => updateStars(parseInt(star.dataset.value)));
                    star.addEventListener('mouseout', () => updateStars(parseInt(ratingValueInput.dataset.currentRating)));
                    
                    ratingContainer.appendChild(star);
                }
                updateStars(0);
            }
            
            function updateStars(value) {
                const stars = ratingContainer.querySelectorAll('.star');
                stars.forEach(star => {
                    const isFilled = parseInt(star.dataset.value) <= value;
                    star.innerHTML = generateStarSVG(isFilled);
                });
            }

            function renderComments() {
                const comments = getComments().sort((a, b) => b.id - a.id); // Ordenar por más reciente
                commentsListContainer.innerHTML = '';
                
                if (comments.length === 0) {
                    commentsListContainer.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 p-4">Aún no hay comentarios. ¡Sé el primero!</p>';
                    commentsSummaryContainer.innerHTML = '<p class="text-gray-600 dark:text-gray-300">0 comentarios registrados.</p>';
                    return;
                }
                
                // --- Resumen ---
                const totalRating = comments.reduce((sum, c) => sum + c.rating, 0);
                const averageRating = (totalRating / comments.length).toFixed(1);
                const starIcons = Array(5).fill(0).map((_, i) => 
                    i < Math.round(averageRating) ? generateStarSVG(true) : generateStarSVG(false)
                ).join('');
                
                commentsSummaryContainer.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-xl font-bold text-primary dark:text-secondary">${averageRating}</span>
                        <div class="flex">${starIcons}</div>
                    </div>
                    <p class="text-gray-600 dark:text-gray-300 font-medium">${comments.length} comentarios registrados.</p>
                `;

                // --- Lista de Comentarios ---
                comments.forEach(comment => {
                    const item = document.createElement('article');
                    item.className = 'bg-white dark:bg-gray-800 p-5 rounded-lg shadow-md border border-gray-100 dark:border-gray-700 hover:shadow-lg transition duration-200';
                    
                    const header = document.createElement('div');
                    header.className = 'flex items-center justify-between mb-3 border-b pb-2 border-gray-200 dark:border-gray-700';
                    
                    // Puntuación
                    const itemRating = document.createElement('div');
                    itemRating.className = 'flex items-center';
                    itemRating.innerHTML = Array(5).fill(0).map((_, i) => 
                        i < comment.rating ? generateStarSVG(true) : generateStarSVG(false)
                    ).join('');
                    
                    // Tipo (Badge)
                    const typeBadge = document.createElement('span');
                    let badgeClass = 'bg-gray-200 text-gray-800';
                    if (comment.type === 'Sugerencia') badgeClass = 'bg-secondary/20 text-secondary dark:bg-secondary/30 dark:text-orange-300';
                    else if (comment.type === 'Queja' || comment.type === 'Reclamo') badgeClass = 'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300';
                    else if (comment.type === 'Comentario') badgeClass = 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300';
                    
                    typeBadge.className = `px-3 py-1 text-xs font-semibold rounded-full ${badgeClass}`;
                    typeBadge.textContent = comment.type;
                    
                    header.appendChild(itemRating);
                    header.appendChild(typeBadge);
                    
                    // Mensaje
                    const message = document.createElement('p');
                    message.className = 'text-gray-700 dark:text-gray-300 mb-3 leading-relaxed italic';
                    message.textContent = comment.message;
                    
                    // Footer (Anónimo y Fecha)
                    const footer = document.createElement('div');
                    footer.className = 'text-xs text-gray-400 dark:text-gray-500 flex justify-between pt-2 border-t border-dashed border-gray-100 dark:border-gray-700';
                    
                    // Aquí se genera el Alias Anónimo
                    const alias = `Usuario #${comment.id % 997}`; // Genera un alias simple basado en el ID
                    footer.innerHTML = `
                        <span>Publicado por: <strong class="font-medium text-gray-500 dark:text-gray-400">${alias}</strong></span>
                        <span>Fecha: ${comment.date}</span>
                    `;
                    
                    item.appendChild(header);
                    item.appendChild(message);
                    item.appendChild(footer);
                    
                    commentsListContainer.appendChild(item);
                });
            }


            // --- 3. Lógica de Envío del Formulario ---

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const type = document.getElementById('pqrsType').value;
                const message = document.getElementById('message').value.trim();
                const rating = parseInt(ratingValueInput.value);
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();

                // Validación
                if (!type || !message || rating === 0) {
                    showFormMessage('Por favor, complete todos los campos obligatorios (Tipo, Mensaje y Puntuación).', 'red');
                    return;
                }
                if (message.length < 20) {
                     showFormMessage('El mensaje debe tener al menos 20 caracteres.', 'red');
                    return;
                }

                const newComment = {
                    id: Date.now(),
                    type: type,
                    message: message,
                    rating: rating,
                    // Usamos la fecha local para el display
                    date: new Date().toLocaleDateString('es-CO'), 
                    // El nombre y correo no se usan en el render, pero se guardan
                    name: name || 'Anónimo', 
                    email: email || 'No proporcionado'
                };

                saveComment(newComment);
                form.reset(); // Limpiar el formulario
                ratingValueInput.value = '0';
                ratingValueInput.setAttribute('data-current-rating', '0');
                updateStars(0);
                
                renderComments(); // Redibujar la lista con el nuevo comentario
                
                showFormMessage('¡Gracias! Tu contribución ha sido enviada y publicada de forma anónima.', 'green');
            });
            
            function showFormMessage(msg, type) {
                formMessage.textContent = msg;
                formMessage.classList.remove('hidden', 'bg-red-100', 'bg-green-100', 'text-red-700', 'text-green-700', 'dark:bg-red-900', 'dark:bg-green-900', 'dark:text-red-300', 'dark:text-green-300');
                
                if (type === 'red') {
                    formMessage.classList.add('bg-red-100', 'text-red-700', 'dark:bg-red-900', 'dark:text-red-300');
                } else {
                    formMessage.classList.add('bg-green-100', 'text-green-700', 'dark:bg-green-900', 'dark:text-green-300');
                }
                
                setTimeout(() => formMessage.classList.add('hidden'), 5000);
            }

            // --- Inicialización ---
            initRating();
            renderComments(); 
        });
    </script>

</body>
</html>
